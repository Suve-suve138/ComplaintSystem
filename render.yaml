databases:
  - name: complaintsystem-db
    databaseName: complaintsystem
    plan: free

services:
  - type: web
    name: ComplaintSystem
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn ComplaintSystem.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: complaintsystem-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.3"
